<!-- Шапка сайта — подключается через JS-include -->
<header id="header" class="site-header d-flex align-items-center">
  <div class="container-fluid container-xl position-relative d-flex align-items-center">

    <!-- Логотип -->
    <a class="site-header__brand flex-shrink-0" href="/" aria-label="На главную">
      <img src="/favicon.ico" alt="бардаков.рф" class="site-header__logo-img">
    </a>

    <!-- Основная навигация (desktop ≥992px) -->
    <nav class="main-nav d-none d-lg-flex ms-auto" role="navigation" aria-label="Основная навигация">
      <ul class="d-flex list-unstyled align-items-center m-0 p-0">
        <li>
          <a href="/" class="main-nav__link">Обо мне</a>
        </li>
        <li class="main-nav__item--has-sub">
          <a href="/obuchenie/" class="main-nav__link main-nav__link--has-sub">
            Обучение <i class="bi bi-chevron-down main-nav__chevron" aria-hidden="true"></i>
          </a>
          <ul class="main-nav__sub list-unstyled">
            <li><a href="/obuchenie/elektromonter.html" class="main-nav__sub-link">Электромонтер</a></li>
            <li><a href="/obuchenie/kip/" class="main-nav__sub-link">КИП</a></li>
            <li><a href="/obuchenie/ksk.html" class="main-nav__sub-link">КСК</a></li>
            <li><a href="/obuchenie/pm02/lektsii/" class="main-nav__sub-link">ПМ.02 Лекции</a></li>
          </ul>
        </li>
        <li class="main-nav__item--has-sub">
          <a href="/abiturientu/" class="main-nav__link main-nav__link--has-sub">
            Абитуриенту <i class="bi bi-chevron-down main-nav__chevron" aria-hidden="true"></i>
          </a>
          <ul class="main-nav__sub list-unstyled">
            <li><a href="/abiturientu/professii/" class="main-nav__sub-link">Профессии</a></li>
            <li><a href="/abiturientu/spetsialnosti/" class="main-nav__sub-link">Специальности</a></li>
            <li><a href="/abiturientu/dokumentatsiya.html" class="main-nav__sub-link">Документация</a></li>
          </ul>
        </li>
        <li class="nav-xl-only">
          <a href="/vospitanie/" class="main-nav__link">Воспитание</a>
        </li>
      </ul>
    </nav>

    <!-- Иконки действий (≥768px) -->
    <div class="header-icons d-none d-md-flex align-items-center gap-1 flex-shrink-0">
      <button class="header-icon-btn" id="search-btn"
              type="button" title="Поиск" aria-label="Поиск"
              aria-expanded="false" aria-controls="searchModal">
        <i class="bi bi-search" aria-hidden="true"></i>
      </button>
      <button class="header-icon-btn" id="theme-toggle"
              type="button" title="Тёмная тема" aria-label="Тёмная тема"
              onclick="return toggleDarkTheme(),!1">
        <i class="bi bi-moon-fill" aria-hidden="true"></i>
      </button>
      <button class="header-icon-btn" id="a11y-toggle"
              type="button" title="Версия для слабовидящих" aria-label="Версия для слабовидящих"
              aria-expanded="false" aria-controls="a11yPanel"
              onclick="return toggleA11y(),!1">
        <i class="bi bi-eye" aria-hidden="true"></i>
      </button>
      <button class="header-icon-btn" id="offcanvas-toggle"
              type="button"
              data-bs-toggle="offcanvas" data-bs-target="#offcanvasNav"
              aria-controls="offcanvasNav"
              title="Все разделы" aria-label="Все разделы">
        <svg width="20" height="16" viewBox="0 0 20 16" fill="currentColor" aria-hidden="true">
          <rect x="3" y="0"  width="14" height="2" rx="1"/>
          <rect x="0" y="7"  width="20" height="2" rx="1"/>
          <rect x="3" y="14" width="14" height="2" rx="1"/>
        </svg>
      </button>
    </div>

    <!-- Гамбургер (только <768px, иначе виден в header-icons) -->
    <button class="header-icon-btn d-flex d-md-none ms-auto"
            type="button"
            data-bs-toggle="offcanvas" data-bs-target="#offcanvasNav"
            aria-controls="offcanvasNav"
            aria-label="Открыть меню" title="Меню">
      <i class="bi bi-list" style="font-size:1.5rem" aria-hidden="true"></i>
    </button>

  </div>
</header>

<!-- Панель доступности (position:fixed, поверх всего) -->
<div class="a11y-panel" id="a11yPanel" role="dialog" aria-label="Настройки доступности" hidden>
  <p class="a11y-panel__title"><i class="bi bi-eye me-2"></i>Версия для слабовидящих</p>
  <div class="a11y-options">
    <label class="a11y-option">
      <input type="checkbox" id="a11yLargeFont">
      <span>Крупный шрифт</span>
    </label>
    <label class="a11y-option">
      <input type="checkbox" id="a11yHighContrast">
      <span>Высокий контраст</span>
    </label>
    <label class="a11y-option">
      <input type="checkbox" id="a11yNoAnimations">
      <span>Без анимаций</span>
    </label>
  </div>
  <div class="a11y-panel__footer">
    <button type="button" class="a11y-reset" id="a11yReset">↩ Сбросить</button>
    <button type="button" class="a11y-close" id="a11yClose">✕ Закрыть</button>
  </div>
</div>

<!-- Offcanvas навигация — основная панель (справа) -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNav" aria-labelledby="offcanvasNavLabel">

  <div class="offcanvas-header oc-header">
    <a href="/" class="oc-header__brand" data-bs-dismiss="offcanvas">
      <img src="/favicon.ico" alt="бардаков.рф" class="site-header__logo-img me-2" style="width:28px;height:28px;">
      <span class="oc-header__sub" id="offcanvasNavLabel">Персональный сайт преподавателя</span>
    </a>
    <button type="button" class="oc-dismiss-btn ms-auto flex-shrink-0" data-bs-dismiss="offcanvas" aria-label="Закрыть">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>

  <div class="offcanvas-body p-0">
    <div class="oc-panel__scroll">

      <!-- Иконки действий (только <768px, при ≥768px они уже в шапке) -->
      <div class="offcanvas-actions d-flex d-md-none align-items-center gap-1 px-3 py-2 border-bottom border-dark-subtle">
        <button class="header-icon-btn" id="theme-toggle-mobile"
                type="button" title="Тёмная тема" aria-label="Тёмная тема"
                onclick="return toggleDarkTheme(),!1">
          <i class="bi bi-moon-fill" aria-hidden="true"></i>
        </button>
        <button class="header-icon-btn"
                type="button" title="Версия для слабовидящих" aria-label="Версия для слабовидящих"
                onclick="return toggleA11y(),!1">
          <i class="bi bi-eye" aria-hidden="true"></i>
        </button>
        <button class="header-icon-btn" id="search-btn-mobile"
                type="button" title="Поиск" aria-label="Поиск">
          <i class="bi bi-search" aria-hidden="true"></i>
        </button>
      </div>

      <nav class="oc-nav" aria-label="Разделы сайта">
        <a href="/" class="oc-nav__link" data-bs-dismiss="offcanvas">
          <i class="bi bi-person-circle oc-nav__icon" aria-hidden="true"></i>
          <span>Обо мне</span>
        </a>

        <button class="oc-nav__link oc-nav__link--parent" type="button"
                data-oc-title="Обучение" data-oc-sub="ocSubObuchenie">
          <i class="bi bi-book oc-nav__icon" aria-hidden="true"></i>
          <span>Обучение</span>
          <i class="bi bi-chevron-right oc-nav__arrow" aria-hidden="true"></i>
        </button>

        <button class="oc-nav__link oc-nav__link--parent" type="button"
                data-oc-title="Абитуриенту" data-oc-sub="ocSubAbiturient">
          <i class="bi bi-mortarboard oc-nav__icon" aria-hidden="true"></i>
          <span>Абитуриенту</span>
          <i class="bi bi-chevron-right oc-nav__arrow" aria-hidden="true"></i>
        </button>

        <a href="/vospitanie/" class="oc-nav__link" data-bs-dismiss="offcanvas">
          <i class="bi bi-heart oc-nav__icon" aria-hidden="true"></i>
          <span>Воспитание</span>
        </a>
        <a href="/search/" class="oc-nav__link" data-bs-dismiss="offcanvas">
          <i class="bi bi-search oc-nav__icon" aria-hidden="true"></i>
          <span>Поиск</span>
        </a>
      </nav>

    </div>

    <!-- Шаблоны подменю (скрытые, клонируются в #ocSidePanel через JS) -->
    <template id="ocSubObuchenie">
      <a href="/obuchenie/" class="oc-nav__sub-link">
        <i class="bi bi-grid-fill me-2 opacity-75" aria-hidden="true"></i>Все материалы по обучению
      </a>
      <a href="/obuchenie/elektromonter.html" class="oc-nav__sub-link">Электромонтер</a>
      <a href="/obuchenie/kip/" class="oc-nav__sub-link">КИП</a>
      <a href="/obuchenie/ksk.html" class="oc-nav__sub-link">КСК</a>
      <a href="/obuchenie/pm02/lektsii/" class="oc-nav__sub-link">ПМ.02 Лекции</a>
    </template>

    <template id="ocSubAbiturient">
      <a href="/abiturientu/" class="oc-nav__sub-link">
        <i class="bi bi-grid-fill me-2 opacity-75" aria-hidden="true"></i>Всё для абитуриентов
      </a>
      <a href="/abiturientu/professii/" class="oc-nav__sub-link">Профессии</a>
      <a href="/abiturientu/spetsialnosti/" class="oc-nav__sub-link">Специальности</a>
      <a href="/abiturientu/dokumentatsiya.html" class="oc-nav__sub-link">Документация</a>
    </template>

  </div>
</div>

<!--
  Боковая панель подменю — отдельный position:fixed блок.
  Расположена ЛЕВЕЕ основного offcanvas (right: var(--oc-panel-w)).
  Стартует с translateX(100%) — спрятана за правым краем основной панели.
  При .is-open → translateX(0) — выезжает влево рядом с основным.
-->
<div class="oc-side-panel" id="ocSidePanel" aria-hidden="true">
  <div class="oc-header">
    <button class="oc-back-btn" id="ocBackBtn" type="button" aria-label="Назад">
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
      <span id="ocSubTitle"></span>
    </button>
    <button type="button" class="oc-dismiss-btn ms-auto flex-shrink-0" id="ocSideDismiss" aria-label="Закрыть">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>
  <div class="oc-panel__scroll">
    <nav class="oc-nav" id="ocSubNav" aria-label="Подраздел"></nav>
  </div>
</div>

<!-- Модальное окно поиска -->
<div class="search-modal" id="searchModal" aria-hidden="true">
  <div class="search-modal__overlay" id="searchModalOverlay"></div>
  <div class="search-modal__dialog" role="dialog" aria-modal="true" aria-label="Поиск по сайту">
    <button class="search-modal__close" id="searchModalClose" aria-label="Закрыть" type="button">
      <i class="bi bi-x-lg"></i>
    </button>
    <h2 class="search-modal__heading">Поиск по сайту</h2>
    <form class="search-modal__form" role="search" action="/search/" method="get">
      <div class="search-modal__input-wrap">
        <i class="bi bi-search search-modal__icon" aria-hidden="true"></i>
        <input type="search" name="q" class="search-modal__input" id="searchModalInput"
               placeholder="Введите запрос..." autocomplete="off" autocorrect="off">
        <button type="submit" class="search-modal__submit">Найти</button>
      </div>
    </form>
  </div>
</div>
