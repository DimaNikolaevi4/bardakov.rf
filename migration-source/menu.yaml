    alt: "Рособрнадзор"
  - title: "Генеральная прокуратура Российской Федерации"
    short_title: "Генпрокуратура"
    url: "https://epp.genproc.gov.ru/"
    icon: "prok-rf.webp"
    alt: "Генеральная прокуратура РФ"
  - title: "Министерство труда и социальной защиты"
    short_title: "Минтруд"
    url: "https://mintrud.gov.ru/"
    icon: "min-tr.webp"
    alt: "Министерство труда и социальной защиты"
  - title: "Федеральная служба по труду и занятости"
    short_title: "Роструд"
    url: "https://rostrud.gov.ru/"
    icon: "rostrud.gov.svg"
    alt: "Роструд"
  - title: "Официальный сайт МЧС России"
    short_title: "МЧС России"
    url: "https://www.mchs.gov.ru/"
    icon: "MCHS.webp"
    alt: "МЧС России"
  - title: "Официальный портал Правительства Ростовской области"
    short_title: "Правительство РО"
