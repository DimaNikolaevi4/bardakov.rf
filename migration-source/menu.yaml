    url: "https://www.minobrnauki.gov.ru/"
    icon: "MNVO.webp"
    alt: "Минобрнауки России"

# === ФУТЕР: КАРТА САЙТА ===
footer_bottom:
  copyright: "© {year} Бардаков.рф. Все права защищены."
  links:
    - title: "Карта сайта"
      url: "/sitemap.xml"

# === ПАНЕЛЬ ДОСТУПНОСТИ (a11y-panel) ===
a11y_panel:
  title: "Версия для слабовидящих"
  icon: "bi-eye"
  options:
    - id: "a11yLargeFont"
      label: "Крупный шрифт"
    - id: "a11yHighContrast"
      label: "Высокий контраст"
    - id: "a11yNoAnimations"
      label: "Без анимаций"
  actions:
    reset: "↩ Сбросить"
    close: "✕ Закрыть"

# === МОДАЛЬНОЕ ОКНО ПОИСКА ===
search_modal:
  heading: "Поиск по сайту"
  placeholder: "Введите запрос..."
  submit_button: "Найти"
  action: "/search/"
  method: "get"
  param: "q"
