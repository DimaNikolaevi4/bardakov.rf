# Структура навигации сайта бардаков.рф
# Источник: old/new-stack/site/assets/components/header.html + footer.html
# Создано: 2026-10-08 (Этап 1.3)

# === ГЛАВНОЕ МЕНЮ (header, desktop ≥992px) ===
main_menu:
  - title: "Обо мне"
    url: "/"
    icon: "bi-person-circle"
    note: "Ссылка на главную (на странице раздела нет отдельной landing)"

  - title: "Обучение"
    url: "/obuchenie/"
    icon: "bi-book"
    has_sub: true
    submenu:
      - title: "Все материалы по обучению"
        url: "/obuchenie/"
        icon: "bi-grid-fill"
      - title: "Электромонтер"
        url: "/obuchenie/elektromonter/"
      - title: "КИП"
        url: "/obuchenie/kip/"
      - title: "КСК"
        url: "/obuchenie/ksk/"
      - title: "ПМ.02 Лекции"
        url: "/obuchenie/pm02/lektsii/"

  - title: "Абитуриенту"
    url: "/abiturientu/"
    icon: "bi-mortarboard"
    has_sub: true
    submenu:
      - title: "Всё для абитуриентов"
        url: "/abiturientu/"
        icon: "bi-grid-fill"
      - title: "Профессии"
        url: "/abiturientu/professii/"
      - title: "Специальности"
        url: "/abiturientu/spetsialnosti/"
      - title: "Документация"
        url: "/abiturientu/dokumentatsiya/"

  - title: "Воспитание"
    url: "/vospitanie/"
    icon: "bi-heart"

# === OFFCANVAS / МОБИЛЬНОЕ МЕНЮ ===
# В дополнение к main_menu, в offcanvas есть:
mobile_extra:
  - title: "Поиск"
    url: "/search/"
    icon: "bi-search"

# === ИКОНКИ В ШАПКЕ (header-icons, desktop) ===
header_actions:
  - id: "search-btn"
    title: "Поиск"
    icon: "bi-search"
    action: "open search modal"
  - id: "theme-toggle"
    title: "Тёмная тема"
    icon: "bi-moon-fill"
    action: "toggle dark theme"
  - id: "a11y-toggle"
    title: "Версия для слабовидящих"
    icon: "bi-eye"
    action: "open a11y panel"
  - id: "offcanvas-toggle"
    title: "Все разделы"
    icon: "menu (svg)"
    action: "open offcanvas nav"

# === ФУТЕР: НАВИГАЦИЯ ===
footer_nav:
  - title: "Навигация"
    links:
      - title: "Обо мне"
        url: "/obo-mne/"
        icon: "bi-chevron-right"
      - title: "Обучение"
        url: "/obuchenie/"
        icon: "bi-chevron-right"
      - title: "Абитуриенту"
        url: "/abiturientu/"
        icon: "bi-chevron-right"
      - title: "Воспитание"
        url: "/vospitanie/"
        icon: "bi-chevron-right"
      - title: "Поиск по сайту"
        url: "/search/"
        icon: "bi-chevron-right"
  - title: "Материалы"
    links:
      - title: "Учебные материалы"
        url: "/obuchenie/"
        icon: "bi-chevron-right"
      - title: "Лекции"
        url: "/obuchenie/"
        icon: "bi-chevron-right"
      - title: "Практические работы"
        url: "/obuchenie/"
        icon: "bi-chevron-right"
      - title: "Абитуриентам"
        url: "/abiturientu/"
        icon: "bi-chevron-right"

# === ФУТЕР: ОФИЦИАЛЬНЫЕ РЕСУРСЫ (ГОССЫЛКИ) ===
