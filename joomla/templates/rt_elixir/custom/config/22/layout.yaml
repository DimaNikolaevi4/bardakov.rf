  custom-2183:
    title: 'Custom HTML'
    attributes:
      html: "<p align=\"center\"><em><strong>Уважаемые абитуриенты</strong></em></p>\n<p align=\"left\"><img style=\"float: left; margin: 25px;\" title=\"и.о. директора Сальского индустриального техникума Якимова Т. В.\" src=\"https://sit-salsk.ru/wp-content/uploads/2022/10/Якимова-Татьяна-Владимировна-зам.-дир.-по-учебной-работе-копия.jpg\" width=\"40%\" />Государственное бюджетное профессиональное образовательное учреждение Ростовской области «Сальский индустриальный техникум» является современным образовательным учреждением, успешно готовящим кадры среднего звена для развивающейся экономики Донского края.<br />Техникум молод — в 2023 году он отметит своё 45-летие — и он динамичен, способен быстро реагировать на изменения требований законодательства, запросов экономики региона и рынка труда.<br />За эти годы он прошел путь от филиала Краснодарского станкостроительного техникума до самостоятельного учреждения, являющегося одним из лучших в отрасли.<br />Образовательные программы, реализуемые в техникуме, соответствуют приоритетным направлениям технологического развития экономики и производства: автоматизация и роботизация, IT-технологии, экономика и управление предприятием.</p>\n<p align=\"left\">Коллектив техникума постоянно работает над повышением уровня образовательного процесса, совершенствованием всего учебно-программного комплекса, над повышением качества подготовки молодых специалистов.</p>\n<p align=\"left\">Из года в год укрепляется учебно-материальная база, повышается профессиональный уровень преподавательского и учебно-вспомогательного персонала.</p>\n<p align=\"left\">Сегодня 50% преподавателей имеют высшую квалификационную категорию и 33% — первую. Преподавательский состав техникума весьма молод — средний возраст составляет около 40 лет. Это — сплав зрелости и профессионального опыта. Ежегодно наши ряды пополняются молодыми специалистами — творческими и инициативными. Наши педагоги принимают самое активное участие в конкурсах педагогического мастерства различных уровней — от территориального до регионального и Всероссийского — и всегда достойно представляют наш коллектив, демонстрируя высокий уровень профессионализма.</p>\n<p align=\"left\">На базе техникума также проводятся мероприятия областного и территориального значения.</p>\n<p align=\"left\">Сальский индустриальный техникум сегодня — это качественное образование и организация учебного процесса с использованием современных образовательных технологий, комфортабельные учебные аудитории, оснащенные высокотехнологичным лабораторным оборудованием.</p>\n<p align=\"left\">Это также доброжелательная творческая атмосфера, создающая оптимальные условия для развития творческого потенциала студентов, и интересная студенческая жизнь. Наши студенты активно занимаются спортом, художественным и техническим творчеством. Работает команда КВН «Новое поколение», студенческое самоуправление, развито волонтерское движение. Наши ребята становятся победителями и призерами территориальных и областных конкурсов профессионального мастерства, о чем всегда оперативно информирует посетителей сайта «Лента новостей».</p>\n<p align=\"left\">В коллективе в течение многих лет сложилась обстановка строгого контроля и ответственности за порученное дело, нетерпимости к халатному отношению к учебе, нарушениям Устава техникума и правил внутреннего распорядка, к проявлениям бескультурья и невежества.</p>\n<p align=\"left\">Всё это вместе позволяет давать качественное профессиональное образование, создает престиж и неповторимый образ нашему техникуму, а выпускникам дает уверенность в трудоустройстве и успешной карьере.</p>\n<p align=\"left\">Молодость — самая прекрасная пора в жизни человека. Поэтому, обращаясь к молодежи, нашим студентам и выпускникам школ, хочу сказать: максимально используйте это время для своего профессионального роста и духовного развития своей личности, дерзайте — и вы достигнете самых высоких жизненных вершин.</p>"
