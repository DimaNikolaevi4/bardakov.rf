  simplecontent-9547:
    title: 'Simple Content'
    attributes:
      class: ''
      title: ''
      items:
        -
          layout: header
          created_date: ''
          content_title: 'История техникума'
          author: ''
          leading_content: ''
          main_content: "История Сальского индустриального техникума тесно связана с развитием Сальского завода Кузнечно-прессового оборудования (КПО). Стране нужны были специалисты: технологи, конструкторы, мастера, начальники цехов, токари, фрезеровщики, слесаря, шлифовщики.<br>\nС 1993 года по Приказу №123 от 25 марта министра образования Сальский станкостроительный техникум переименован в Сальский индустриальный техникум. С этого года работают факультеты по специальностям: – «Мастер контрольно измерительных приборов и автоматики» – «Юрист-бухгалтер-правовед» – «Экономика, бухгалтерский учёт и контроль по отраслям» – Электромонтер по ремонту и обслуживанию электрооборудования» – «Компьютерные системы и комплексы»."
