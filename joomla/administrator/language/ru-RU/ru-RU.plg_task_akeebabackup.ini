PLG_TASK_AKEEBABACKUP_TASK_BACKUP_TITLE="Akeeba Backup – Создать резервную копию"
PLG_TASK_AKEEBABACKUP_TASK_BACKUP_DESC="Создайте резервную копию вашего сайта с помощью Akeeba Backup."

PLG_TASK_AKEEBABACKUP_TASK_CLIBACKUP_TITLE="Резервное копирование Akeeba –только для CLI"
PLG_TASK_AKEEBABACKUP_TASK_CLIBACKUP_DESC="Создайте резервную копию вашего сайта с помощью Akeeba Backup. Этот тип задач работает <strong> только</strong>, когда запланированные задачи запускаются заданием CLI CRON."

PLG_TASK_AKEEBABACKUP_NOTE01_DESC="<strong><span aria-hidden=\"true\" class=\"fa fa-exclamation-triangle\"></span> ВАЖНО!</strong> Пожалуйста, ознакомьтесь с нашей документацией, чтобы понять ограничения и компромиссы при создании резервной копии вашего сайта с помощью Joomla. Запланированные задачи."

PLG_TASK_AKEEBABACKUP_NOTE02_DESC="Этот тип задачи резервного копирования будет выполняться <strong>только</strong>, если вы используете CLI-приложение Joomla для запуска запланированных задач. Это более эффективно и надежно, чем тип задачи 'Akeeba Backup – Сделайте резервную копию', но не будет выполняться при использовании отложенного планирования задач или при использовании URL-адреса Joomla для запуска запланированных задач. Если вы хотите использовать любой из двух последних методов, пожалуйста, используйте вместо этого тип задачи 'Akeeba Backup – Сделайте резервную копию'."

PLG_TASK_AKEEBABACKUP_PROFILE_LABEL="Профиль резервного копирования"
PLG_TASK_AKEEBABACKUP_PROFILE_DESC="Выберите, какой профиль резервного копирования использовать для запланированных резервных копий."