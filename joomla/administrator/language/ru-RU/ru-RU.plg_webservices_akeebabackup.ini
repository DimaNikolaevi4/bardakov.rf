PLG_WEBSERVICES_AKEEBABACKUP="Веб-службы - Резервное копирование Akeeba"
PLG_WEBSERVICES_AKEEBABACKUP_XML_DESCRIPTION="Включает поддержку Akeeba JSON API версии 3 на вашем сайте, которая позволяет вам удаленно создавать резервные копии и управлять ими с помощью совместимого программного обеспечения и приложений.<br/><strong>Важно!</strong> Для этого требуется беспрепятственный доступ к приложению Joomla API вашего сайта (папка <code>/api</code>). Если у вас отключен доступ к приложению Joomla API, включения этого плагина будет недостаточно. Пожалуйста, ознакомьтесь с документацией"